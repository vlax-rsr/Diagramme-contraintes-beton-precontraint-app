name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v4

      # PySide6 charge ses bibliothèques graphiques via EGL/OpenGL : sans elles,
      # l'import de QtWidgets échoue sur Linux (libEGL.so.1 introuvable).
      - name: Bibliothèques graphiques Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libfontconfig1

      - name: Installer Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installer le projet et ses outils
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Analyse statique (ruff)
        run: ruff check .

      - name: Tests
        run: pytest

      - name: Couverture
        run: pytest --cov=beton_precontraint --cov-report=term-missing